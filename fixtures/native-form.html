<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Senior Anvil Engineer - ACME Corporation</title>
  <meta property="og:site_name" content="ACME Corporation">
  <link rel="stylesheet" href="fixtures.css">
</head>
<body>
  <h1>Senior Anvil Engineer</h1>
  <p>Every field type, plus the fields that must never be recorded. A plain
  form that POSTs and navigates.</p>

  <form action="/submit" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="hidden-token-never-recorded">

    <label for="first_name">First name <span class="req">*</span></label>
    <input id="first_name" name="first_name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email">

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">

    <label for="site">Portfolio URL</label>
    <input id="site" name="site" type="url">

    <label for="years">Years of anvil experience</label>
    <input id="years" name="years" type="number">

    <label for="start">Earliest start date</label>
    <input id="start" name="start" type="date">

    <label for="why">Why ACME? <span class="req">*</span></label>
    <textarea id="why" name="why" required></textarea>

    <label for="auth">Work authorization</label>
    <select id="auth" name="auth">
      <option value="">Select...</option>
      <option value="citizen">US citizen</option>
      <option value="visa">Requires sponsorship</option>
    </select>

    <label for="locations">Locations</label>
    <select id="locations" name="locations" multiple>
      <option value="mesa">Mesa, AZ</option>
      <option value="cliffside">Cliffside, NM</option>
      <option value="remote">Remote</option>
    </select>

    <fieldset>
      <legend>Willing to relocate?</legend>
      <label><input type="radio" name="relocate" value="yes"> Yes</label>
      <label><input type="radio" name="relocate" value="no"> No</label>
    </fieldset>

    <div class="question">Preferred shifts</div>
    <div>
      <label><input type="checkbox" name="shifts" value="day"> Day shift</label>
      <label><input type="checkbox" name="shifts" value="night"> Night shift</label>
    </div>

    <label><input type="checkbox" name="privacy" id="privacy"> I agree to the privacy policy</label>

    <label for="resume">Resume/CV</label>
    <input id="resume" name="resume" type="file">

    <!-- Never recorded: password, card number, SSN -->
    <label for="pw">Create a password</label>
    <input id="pw" name="pw" type="password">

    <label for="cc">Application fee card</label>
    <input id="cc" name="payment" autocomplete="cc-number">

    <label for="ssn">Social Security Number</label>
    <input id="ssn" name="tax_id">

    <!-- Honeypot: empty and not rendered -->
    <input name="website_hp" style="display:none">

    <!-- EEO: skipped unless the popup toggle is on -->
    <div id="eeoc_fields">
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Decline to self-identify</option>
        <option value="m">Male</option>
        <option value="f">Female</option>
      </select>
    </div>

    <button type="submit">Submit application</button>
  </form>
</body>
</html>
