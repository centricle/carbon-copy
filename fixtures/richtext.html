<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tunnel Paint Artist - ACME Corporation</title>
  <meta property="og:site_name" content="ACME Corporation">
  <link rel="stylesheet" href="fixtures.css">
</head>
<body>
  <h1>Tunnel Paint Artist</h1>
  <p>Rich-text answers: a contenteditable editor (ProseMirror, Quill, Draft
  style) and an editor inside a same-origin iframe (TinyMCE, CKEditor 4
  style).</p>

  <form id="f">
    <div id="cover-label" class="question">Cover letter</div>
    <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="cover-label"><p><br></p></div>

    <div class="question">Describe your best tunnel</div>
    <iframe id="frame-editor" title="Describe your best tunnel" class="editor" style="width:100%;height:6rem"></iframe>

    <button type="submit">Send application</button>
  </form>
  <p id="status"></p>

  <script>
    const doc = document.getElementById('frame-editor').contentDocument;
    doc.open();
    doc.write('<!DOCTYPE html><html><body contenteditable="true" style="font:15px system-ui"></body></html>');
    doc.close();
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      fetch('/api/apply', { method: 'POST', body: 'ok' })
        .then(() => { document.getElementById('status').textContent = 'Sent.'; });
    });
  </script>
</body>
</html>
